name: Playwright Regression

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly regression at 01:30 IST (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [qa, prod]
        default: qa
      suite:
        description: Suite to run
        type: choice
        options: [smoke, regression, all]
        default: smoke

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        env:
          CI: true
          TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: reports/
          retention-days: 14
